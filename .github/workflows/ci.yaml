name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://event_booking_app:password@localhost:5432/event_booking_test
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      JWT_EXPIRES_IN: 1h
      LOGIN_RATE_LIMIT: '3000'
      REGISTER_RATE_LIMIT: '3000'
      SENTRY_DSN: https://examplePublicKey@o0.ingest.sentry.io/0
      CLIENT_ORIGIN_DEV: http://localhost:5173

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: event_booking_app
          POSTGRES_PASSWORD: password
          POSTGRES_DB: event_booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
